[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name              = "idle-time"
version           = "2026.8.0"
description       = "System idle time using DBus"
readme            = "README.md"
keywords          = ["idle_time", "idle-time"]
requires-python   = ">=3.7.0"
authors     = [
    {name="Alexander Frenzel", email="alex@relatedworks.com"},
    {name="bkbilly", email="bkbilly@hotmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "jeepney>=0.9.0 ; platform_system != 'Windows'",
    "pywin32>=221 ; platform_system == 'Windows'",
]


[project.urls]
"Source Code" = "https://github.com/escaped/idle_time"

[tool.setuptools.packages.find]
include = ["idle_time*"]

[project.scripts]
idle-time = "idle_time.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["idle_time"]
